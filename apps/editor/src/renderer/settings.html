<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="%BASE_URL%axon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self' blob: data: axon:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob: axon:; media-src 'self' https: data: blob: axon:; font-src 'self' data: blob: axon:; connect-src 'self' ws: http://127.0.0.1:* http://localhost:*; worker-src 'self' blob:; frame-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none';"
        />
        <title>Settings</title>
        <script vite-ignore src="./boot-appearance.js"></script>
        <style>
            :root {
                --axon-boot-background: #313337;
                --axon-boot-foreground: #bfbdb6;
                --axon-boot-accent: #ffb353;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: var(--axon-boot-background);
            }

            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100dvh;
                min-height: 100vh;
                overflow: hidden;
                background: var(--axon-boot-background);
            }

            /*
             * The settings window keeps the same pre-React drag strip as the
             * editor shell so the native hidden titlebar can still move the
             * window during the brief renderer startup, before SettingsHeader's
             * toolbar drag region exists.
             */
            #axon-window-drag-strip {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 36px;
                z-index: 10000;
                -webkit-app-region: drag;
            }

            body.axon-react-ready #axon-window-drag-strip {
                display: none;
            }

            .settings-startup-failure {
                display: flex;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                padding: 24px;
                background: var(--axon-boot-background);
                color: var(--axon-boot-foreground);
                font: 13px system-ui, sans-serif;
            }

            .settings-startup-failure__card {
                max-width: 560px;
                border: 1px solid
                    color-mix(in srgb, var(--axon-boot-foreground) 18%, transparent);
                padding: 18px;
                background: color-mix(
                    in srgb,
                    var(--axon-boot-background) 88%,
                    white 12%
                );
            }

            .settings-startup-failure__title {
                margin-bottom: 8px;
                font-weight: 600;
            }

            .settings-startup-failure__message {
                opacity: 0.75;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <div id="axon-window-drag-strip" aria-hidden="true"></div>
        <div id="root"></div>
        <script type="module" src="/settings.tsx"></script>
    </body>
</html>
