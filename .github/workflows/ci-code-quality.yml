name: Code quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: TypeScript, lint, and repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Validate extension examples
        run: npm run check:examples

      - name: Check renderer TypeScript
        run: npx tsc -p apps/editor/tsconfig.app.json

      - name: Lint editor and built-in extensions
        run: npm run lint

      - name: Check file line limits
        run: npm run check:line-count
