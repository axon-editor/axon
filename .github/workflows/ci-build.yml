name: Build validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop-build:
    name: Desktop application build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure native build binding
        run: node apps/editor/scripts/ensure-native-build-binding.mjs

      - name: Build main process
        run: npm --workspace axon run build:main

      - name: Verify npm language-server release packaging
        run: node apps/editor/scripts/verify-language-servers.mjs --packaging-only

      - name: Validate extension registry inputs
        working-directory: apps/editor
        run: npm run prepare:extension-registry

      - name: Build renderer
        run: npm --workspace axon run build:renderer
