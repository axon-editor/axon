name: Editor tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Renderer and main-process tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure native build binding
        run: node apps/editor/scripts/ensure-native-build-binding.mjs

      - name: Build shared packages
        run: npm run build:packages

      - name: Run editor unit tests
        run: npm --workspace axon test
