name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code quality
    uses: ./.github/workflows/ci-code-quality.yml

  editor_tests:
    name: Editor tests
    uses: ./.github/workflows/ci-editor-tests.yml

  terminal_regressions:
    name: Terminal regressions
    uses: ./.github/workflows/ci-terminal.yml

  build_validation:
    name: Build validation
    uses: ./.github/workflows/ci-build.yml

  core_validation:
    name: Core validation
    uses: ./.github/workflows/ci-core.yml

  filesystem_regressions:
    name: Filesystem regressions
    uses: ./.github/workflows/ci-filesystem.yml

  editor_required:
    name: Editor checks
    if: always()
    needs:
      - code_quality
      - editor_tests
      - terminal_regressions
      - build_validation
    runs-on: ubuntu-latest
    steps:
      - name: Require successful editor jobs
        env:
          CODE_QUALITY_RESULT: ${{ needs.code_quality.result }}
          EDITOR_TESTS_RESULT: ${{ needs.editor_tests.result }}
          TERMINAL_RESULT: ${{ needs.terminal_regressions.result }}
          BUILD_RESULT: ${{ needs.build_validation.result }}
        run: |
          if [[ "$CODE_QUALITY_RESULT" != "success" || \
                "$EDITOR_TESTS_RESULT" != "success" || \
                "$TERMINAL_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" ]]; then
            echo "One or more required editor jobs did not succeed."
            exit 1
          fi

  core_required:
    name: Core tests
    if: always()
    needs:
      - core_validation
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Core validation
        env:
          CORE_RESULT: ${{ needs.core_validation.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" ]]; then
            echo "Core validation did not succeed."
            exit 1
          fi

  ci_required:
    name: CI required
    if: always()
    needs:
      - editor_required
      - core_required
      - filesystem_regressions
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI domain
        env:
          EDITOR_RESULT: ${{ needs.editor_required.result }}
          CORE_RESULT: ${{ needs.core_required.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem_regressions.result }}
        run: |
          if [[ "$EDITOR_RESULT" != "success" || \
                "$CORE_RESULT" != "success" || \
                "$FILESYSTEM_RESULT" != "success" ]]; then
            echo "One or more required CI domains did not succeed."
            exit 1
          fi
